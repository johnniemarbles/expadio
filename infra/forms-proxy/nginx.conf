events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name _;

    # Use a variable so nginx resolves the upstream per-request (not at startup),
    # which avoids "host not found" when the .railway.internal DNS isn't yet ready.
    set $backend "brand-web.railway.internal";

    location / {
      resolver         127.0.0.11 valid=30s;
      proxy_pass         http://$backend:8080;

      # Cloudflare Custom Hostnames send the original custom domain as the Host
      # header. Capture it as X-Original-Host before we rewrite Host to the
      # backend address — brand-web reads this to resolve the tenant.
      # If a CF Worker (or Transform Rule) already set X-Original-Host upstream,
      # prefer that; otherwise derive from the Host nginx received.
      set $x_original_host $http_x_original_host;
      if ($x_original_host = "") {
        set $x_original_host $http_host;
      }
      proxy_set_header   X-Original-Host   $x_original_host;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Host              $backend;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }

    location /health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
