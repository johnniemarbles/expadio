version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: expadio
      POSTGRES_PASSWORD: expadio_password
      POSTGRES_DB: expadio
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expadio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
