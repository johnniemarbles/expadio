name: CF — Origin connectivity diagnostic

on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare API token"
        required: true
        type: string

env:
  ZONE_ID: a871277903f98da014626efd5abe9a17
  RAILWAY_HOST: glorious-enchantment-production.up.railway.app

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.cf_token }}"

      - name: Test Railway reachability (direct)
        run: |
          echo "=== curl Railway with its own Host ==="
          curl -sv --max-time 15 "https://${RAILWAY_HOST}/" \
            -H "Host: ${RAILWAY_HOST}" 2>&1 | tail -20 || true

      - name: Test Railway with custom hostname Host header
        run: |
          echo "=== curl Railway with custom Host: apply.mydreamware.org ==="
          curl -sv --max-time 15 "https://${RAILWAY_HOST}/" \
            -H "Host: apply.mydreamware.org" 2>&1 | tail -20 || true

      - name: Test Railway with forms.expadio.com Host header
        run: |
          echo "=== curl Railway with Host: forms.expadio.com ==="
          curl -sv --max-time 15 "https://${RAILWAY_HOST}/" \
            -H "Host: forms.expadio.com" 2>&1 | tail -20 || true

      - name: Check Cloudflare fallback origin status
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          RESULT=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_hostnames/fallback_origin" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "$RESULT" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              res = r.get('result', {})
              print('Origin:  ' + res.get('origin','?'))
              print('Status:  ' + res.get('status','?'))
              errors = res.get('errors', [])
              if errors:
                  print('Errors:  ' + str(errors))
          else:
              print('API ERROR: ' + str(r))
          "

      - name: Check custom hostname statuses
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          for H in forms.mydreamware.org apply.mydreamware.org; do
            echo "--- $H ---"
            curl -sS "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_hostnames?hostname=$H" \
              -H "Authorization: Bearer $CF_TOKEN" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          res = r.get('result', [])
          if res:
              d = res[0]
              print('  Status:      ' + d.get('status','?'))
              print('  SSL Status:  ' + str((d.get('ssl') or {}).get('status')))
              print('  Ownership:   ' + str(d.get('ownership_verification',{}).get('type','?')))
          else:
              print('  Not found')
          "
          done
