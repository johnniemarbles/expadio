name: Core Spine

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'packages/**'
      - '.github/workflows/core-spine.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'packages/**'
      - '.github/workflows/core-spine.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and test
        run: pnpm check
