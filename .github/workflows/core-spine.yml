name: Core Spine

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'packages/**'
      - 'infra/db/**'
      - '.github/workflows/core-spine.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'packages/**'
      - 'infra/db/**'
      - '.github/workflows/core-spine.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and test
        run: pnpm check

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expadio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expadio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply capability registry migration
        run: psql -h localhost -U postgres -d expadio_test -v ON_ERROR_STOP=1 -f infra/db/migrations/0001_platform_capability_registry.sql

      - name: Run capability registry smoke checks
        run: psql -h localhost -U postgres -d expadio_test -v ON_ERROR_STOP=1 -f infra/db/tests/capability_registry_smoke.sql
