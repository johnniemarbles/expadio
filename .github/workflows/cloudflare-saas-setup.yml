name: Cloudflare for SaaS — one-time setup

on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare API token (Edit Cloudflare Workers template)"
        required: true
        type: string
      brand_web_origin:
        description: "Railway brand-web public URL (no trailing slash)"
        required: true
        type: string
        default: "https://glorious-enchantment-production.up.railway.app"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask token in logs
        run: echo "::add-mask::${{ inputs.cf_token }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cloudflare for SaaS setup
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: bash infra/cloudflare-worker/setup.sh

      - name: Set BRAND_WEB_ORIGIN Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.cf_token }}
        run: |
          echo "${{ inputs.brand_web_origin }}" | \
            npx wrangler secret put BRAND_WEB_ORIGIN \
              --name expadio-forms-proxy \
              --config infra/cloudflare-worker/wrangler.toml

      - name: Print zone ID for Railway
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          ZONE_ID=$(curl -sSf "https://api.cloudflare.com/client/v4/zones?name=expadio.com&status=active" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; z=json.load(sys.stdin)['result']; print(z[0]['id'] if z else 'NOT_FOUND')")
          echo ""
          echo "========================================"
          echo "Set these on Railway brand-web service:"
          echo "  CLOUDFLARE_ZONE_ID=$ZONE_ID"
          echo "  CLOUDFLARE_API_TOKEN=<the token you used>"
          echo "========================================"
