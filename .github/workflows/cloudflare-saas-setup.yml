name: Cloudflare for SaaS — one-time setup

on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare API token (Edit Cloudflare Workers template)"
        required: true
        type: string
      brand_web_origin:
        description: "Railway brand-web public URL"
        required: true
        type: string
        default: "https://glorious-enchantment-production.up.railway.app"

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token in logs
        run: echo "::add-mask::${{ inputs.cf_token }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Cloudflare for SaaS
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          set -euo pipefail
          ZONE_NAME="expadio.com"
          FALLBACK_ORIGIN="forms.expadio.com"

          echo "==> Finding zone ID for $ZONE_NAME ..."
          ZONE_ID=$(curl -sSf "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&status=active" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; z=json.load(sys.stdin)['result']; print(z[0]['id'] if z else '')")

          if [ -z "$ZONE_ID" ]; then
            echo "ERROR: Zone '$ZONE_NAME' not found."
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"

          echo "==> Enabling Custom Hostnames (SSL for SaaS) ..."
          curl -sSf -X PATCH "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/settings/ssl_for_saas" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"value":"on"}' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('OK' if r.get('success') else 'ERROR: '+str(r))"

          echo "==> Adding originless fallback record: ${FALLBACK_ORIGIN} AAAA 100:: ..."
          EXISTING=$(curl -sSf "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=AAAA&name=${FALLBACK_ORIGIN}" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          if [ -n "$EXISTING" ]; then
            echo "Record already exists ($EXISTING), skipping."
          else
            curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"AAAA\",\"name\":\"${FALLBACK_ORIGIN}\",\"content\":\"100::\",\"ttl\":1,\"proxied\":true}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('Created: '+r['result']['id'] if r.get('success') else 'ERROR: '+str(r))"
          fi

          echo "==> Setting fallback origin to ${FALLBACK_ORIGIN} ..."
          curl -sSf -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_hostnames/fallback_origin" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data "{\"origin\":\"${FALLBACK_ORIGIN}\"}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('OK' if r.get('success') else 'WARN: '+str(r.get('errors','')))"

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.cf_token }}
        run: |
          cat > worker.js << 'WORKER'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const originalHost = request.headers.get("host") ?? url.hostname;
              if (url.pathname === "/health" && originalHost === "forms.expadio.com") {
                return new Response("ok\n", { status: 200, headers: { "Content-Type": "text/plain" } });
              }
              const origin = env.BRAND_WEB_ORIGIN?.replace(/\/$/, "");
              if (!origin) return new Response("Worker misconfigured: BRAND_WEB_ORIGIN not set.", { status: 503 });
              const target = new URL(url.pathname + url.search, origin);
              const headers = new Headers(request.headers);
              headers.set("X-Forwarded-Host", originalHost);
              headers.set("X-Forwarded-Proto", "https");
              headers.set("Host", new URL(origin).hostname);
              return fetch(new Request(target.toString(), { method: request.method, headers, body: request.body, redirect: "manual" }));
            },
          };
          WORKER

          cat > wrangler.toml << TOML
          name = "expadio-forms-proxy"
          main = "worker.js"
          compatibility_date = "2024-09-23"
          [[routes]]
          pattern = "forms.expadio.com/*"
          zone_name = "expadio.com"
          TOML

          npx wrangler deploy

      - name: Set BRAND_WEB_ORIGIN Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ inputs.cf_token }}
        run: |
          echo "${{ inputs.brand_web_origin }}" | npx wrangler secret put BRAND_WEB_ORIGIN --name expadio-forms-proxy

      - name: Summary
        run: |
          echo ""
          echo "✅ Cloudflare for SaaS setup complete!"
          echo ""
          echo "Set these two variables on the Railway brand-web service:"
          echo "  CLOUDFLARE_ZONE_ID=$ZONE_ID"
          echo "  CLOUDFLARE_API_TOKEN=<the token you used>"
