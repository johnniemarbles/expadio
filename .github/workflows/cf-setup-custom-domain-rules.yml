name: CF — Custom domain routing rules

on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare API token"
        required: true
        type: string

env:
  ZONE_ID: a871277903f98da014626efd5abe9a17
  RAILWAY_HOST: glorious-enchantment-production.up.railway.app

jobs:
  apply-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.cf_token }}"

      - name: Write JSON payloads to temp files
        run: |
          python3 -c "
          import json
          # Single transform rule: preserve original hostname in X-Forwarded-Host,
          # then override Host to the Railway hostname so Hikari accepts the request.
          transform_rule = {
              'description': 'expadio: rewrite Host for custom domain traffic',
              'expression': 'not ends_with(http.host, \".expadio.com\")',
              'action': 'rewrite',
              'action_parameters': {
                  'uri': {
                      'host': {
                          'value': 'glorious-enchantment-production.up.railway.app'
                      }
                  },
                  'headers': {
                      'X-Forwarded-Host': {
                          'operation': 'set',
                          'expression': 'http.host'
                      }
                  }
              }
          }
          with open('/tmp/transform_payload.json', 'w') as f:
              json.dump({'rules': [transform_rule]}, f)
          print('transform payload:', open('/tmp/transform_payload.json').read())
          "

      - name: Apply Transform Rule (Host + X-Forwarded-Host for custom domains)
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          echo "=== Applying http_request_late_transform ruleset ==="
          RESULT=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_late_transform/entrypoint" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/transform_payload.json)
          echo "$RESULT" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              rules = r.get('result', {}).get('rules', [])
              print('Transform Rule OK: ' + str(len(rules)) + ' rule(s)')
              for rule in rules:
                  print('  - ' + rule.get('description', '?') + ' [' + rule.get('action', '?') + ']')
          else:
              print('FAILED: ' + str(r.get('errors', [])))
              sys.exit(1)
          "

      - name: Verify live (curl apply.mydreamware.org)
        run: |
          sleep 5
          echo "=== curl apply.mydreamware.org ==="
          curl -sv --max-time 15 "https://apply.mydreamware.org/" 2>&1 \
            | grep -E "^[<>]|HTTP/|x-forwarded|x-railway|server:|cf-ray:" || true
