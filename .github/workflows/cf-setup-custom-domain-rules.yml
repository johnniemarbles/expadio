name: "CF — Set up custom domain routing rules"

on:
  workflow_dispatch:
    inputs:
      cf_token:
        description: "Cloudflare API token (Zone:Edit + Rulesets:Edit scope)"
        required: true
        type: string

env:
  ZONE_ID: a871277903f98da014626efd5abe9a17
  RAILWAY_HOST: glorious-enchantment-production.up.railway.app
  # Custom hostnames are those NOT ending in .expadio.com
  CUSTOM_DOMAIN_EXPR: 'not ends_with(http.host, ".expadio.com")'

jobs:
  apply-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.cf_token }}"

      - name: Apply Transform Rule (add X-Forwarded-Host for custom domains)
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          echo "=== Getting existing http_request_transform ruleset ==="
          EXISTING=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_transform/entrypoint" \
            -H "Authorization: Bearer ${CF_TOKEN}")
          echo "Existing transform ruleset: $(echo $EXISTING | python3 -c 'import sys,json; r=json.load(sys.stdin); print(r.get("result",{}).get("id","none"))')"

          # Get existing rules to preserve them
          EXISTING_RULES=$(echo $EXISTING | python3 -c '
import sys, json
r = json.load(sys.stdin)
rules = r.get("result", {}).get("rules", [])
# Filter out any existing X-Forwarded-Host rule we may have added before
rules = [rule for rule in rules if not (
    rule.get("description","") == "expadio: set X-Forwarded-Host for custom domains"
)]
print(json.dumps(rules))
')

          # Build new ruleset with our rule appended
          NEW_RULES=$(python3 -c "
import json
existing = json.loads('''${EXISTING_RULES}''')
new_rule = {
    \"description\": \"expadio: set X-Forwarded-Host for custom domains\",
    \"expression\": \"not ends_with(http.host, \\\".expadio.com\\\")\",
    \"action\": \"rewrite\",
    \"action_parameters\": {
        \"headers\": {
            \"X-Forwarded-Host\": {
                \"operation\": \"set\",
                \"expression\": \"http.host\"
            }
        }
    }
}
existing.append(new_rule)
print(json.dumps(existing))
")

          PAYLOAD="{\"rules\": ${NEW_RULES}}"

          echo "=== Applying Transform Rule ==="
          RESULT=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_transform/entrypoint" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}")

          python3 -c "
import sys, json
r = json.loads('''$(echo $RESULT | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)))')'''  )
if r.get('success'):
    rules = r.get('result',{}).get('rules',[])
    print('Transform Rule OK: ' + str(len(rules)) + ' rule(s) in phase')
    for rule in rules:
        print('  - ' + rule.get('description','?') + ' [' + rule.get('action','?') + ']')
else:
    print('FAILED: ' + str(r.get('errors',[])))
    sys.exit(1)
"

      - name: Apply Origin Rule (override Host to Railway for custom domains)
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
        run: |
          echo "=== Getting existing http_request_origin ruleset ==="
          EXISTING=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_origin/entrypoint" \
            -H "Authorization: Bearer ${CF_TOKEN}")
          echo "Existing origin ruleset: $(echo $EXISTING | python3 -c 'import sys,json; r=json.load(sys.stdin); print(r.get("result",{}).get("id","none"))')"

          # Get existing rules, removing any prior version of ours
          EXISTING_RULES=$(echo $EXISTING | python3 -c '
import sys, json
r = json.load(sys.stdin)
rules = r.get("result", {}).get("rules", [])
rules = [rule for rule in rules if not (
    rule.get("description","") == "expadio: route custom domains to Railway origin"
)]
print(json.dumps(rules))
')

          NEW_RULES=$(python3 -c "
import json
existing = json.loads('''${EXISTING_RULES}''')
new_rule = {
    \"description\": \"expadio: route custom domains to Railway origin\",
    \"expression\": \"not ends_with(http.host, \\\".expadio.com\\\")\",
    \"action\": \"route\",
    \"action_parameters\": {
        \"host_header\": \"${RAILWAY_HOST}\"
    }
}
existing.append(new_rule)
print(json.dumps(existing))
")

          PAYLOAD="{\"rules\": ${NEW_RULES}}"

          echo "=== Applying Origin Rule ==="
          RESULT=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_origin/entrypoint" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}")

          python3 -c "
import sys, json
r = json.loads('''$(echo $RESULT | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)))')''')
if r.get('success'):
    rules = r.get('result',{}).get('rules',[])
    print('Origin Rule OK: ' + str(len(rules)) + ' rule(s) in phase')
    for rule in rules:
        print('  - ' + rule.get('description','?') + ' [' + rule.get('action','?') + ']')
else:
    print('FAILED: ' + str(r.get('errors',[])))
    sys.exit(1)
"

      - name: Verify rules are live (curl apply.mydreamware.org)
        run: |
          echo "=== Waiting 3s for rules to propagate ==="
          sleep 3
          echo "=== curl apply.mydreamware.org ==="
          curl -sv --max-time 15 "https://apply.mydreamware.org/" 2>&1 \
            | grep -E "^[<>]|HTTP/|x-forwarded|x-railway|server:|cf-ray:" || true
