name: CF Hostname — check or register

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Tenant domain to check/register"
        required: true
        type: string
      cf_token:
        description: "Cloudflare API token"
        required: true
        type: string
      register:
        description: "Register if not found?"
        required: false
        default: "false"
        type: string

env:
  ZONE_ID: a871277903f98da014626efd5abe9a17

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.cf_token }}"

      - name: Check hostname status
        env:
          CF_TOKEN: ${{ inputs.cf_token }}
          HOSTNAME: ${{ inputs.hostname }}
          REGISTER: ${{ inputs.register }}
        run: |
          set -euo pipefail
          echo "Checking: $HOSTNAME"
          RESULT=$(curl -sS "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_hostnames?hostname=${HOSTNAME}" \
            -H "Authorization: Bearer $CF_TOKEN")
          FOUND=$(echo "$RESULT" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['id'] if r else '')" 2>/dev/null)

          if [ -n "$FOUND" ]; then
            echo "$RESULT" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)['result'][0]
          print('=== Custom Hostname Found ===')
          print('  ID:         ' + r.get('id',''))
          print('  Hostname:   ' + r.get('hostname',''))
          print('  Status:     ' + r.get('status',''))
          print('  SSL Status: ' + (r.get('ssl') or {}).get('status','none'))
          "
          elif [ "$REGISTER" = "true" ]; then
            echo "Not found — registering..."
            REG=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/custom_hostnames" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"hostname\":\"$HOSTNAME\",\"ssl\":{\"method\":\"http\",\"type\":\"dv\",\"settings\":{\"min_tls_version\":\"1.2\",\"http2\":\"on\"},\"bundle_method\":\"ubiquitous\",\"wildcard\":false},\"custom_metadata\":{\"managed\":\"expadio\"}}")
            echo "$REG" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
            d = r['result']
            print('=== Registered ===')
            print('  ID:         ' + d.get('id',''))
            print('  Status:     ' + d.get('status',''))
            print('  SSL Status: ' + (d.get('ssl') or {}).get('status','none'))
          else:
            print('ERROR: ' + str(r.get('errors')))
          "
          else
            echo "Not registered as a Cloudflare Custom Hostname."
            echo "Run again with register=true to register it."
          fi
