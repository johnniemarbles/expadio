name: Brand Web
on:
  pull_request:
    paths:
      - 'apps/brand-web/**'
      - 'packages/learning/**'
      - 'packages/postgres-runtime/**'
      - 'packages/tenancy/**'
      - 'packages/ui/**'
      - 'infra/db/migrations/009*.sql'
      - 'infra/db/migrations/01*.sql'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/brand-web.yml'
concurrency:
  group: brand-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: |
            apps/brand-web/.next/cache
          key: ${{ runner.os }}-nextjs-brand-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/brand-web/**/*.ts', 'apps/brand-web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-brand-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - run: pnpm --filter @expadio/brand-web check
