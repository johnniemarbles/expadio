name: Platform Web

on:
  pull_request:
    paths:
      - 'apps/platform-web/**'
      - '.github/workflows/platform-web.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/platform-web/**'
      - '.github/workflows/platform-web.yml'

concurrency:
  group: platform-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install platform dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck and build platform
        run: pnpm --filter @expadio/platform-web check
